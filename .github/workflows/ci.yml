name: CI

# Runs on every pull request, and again on main after a merge so main itself is known to be green.
# This is also what makes Dependabot's update pull requests safe to merge.
on:
  pull_request:
  push:
    branches: [main]

# Every action below is pinned to a full commit SHA, with the release it belongs to in the trailing
# comment. A tag such as v7 can be moved to different code by whoever owns the action; a SHA
# cannot. Dependabot reads the comment and updates the SHA and the comment together.

# Least privilege: the job only reads the code, plus the commit list of a pull request so the
# secret scan knows which commits to look at. Nothing here can write to the repository.
permissions:
  contents: read
  pull-requests: read

# A newer push to the same branch makes the older run pointless; stop it and save the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    # Pinned rather than "latest" so a runner image upgrade is a visible change in this file.
    # The image already contains the Android SDK, so there is no SDK setup step.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks scans every commit in the push or pull request, not just the tip.
          fetch-depth: 0
          # The job never pushes, so do not leave the token in the checkout's git config.
          persist-credentials: false

      # First, so a leaked secret fails the run before any build step can echo it into a log.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on the pull request would need write access. The failed check is enough.
          GITLEAKS_ENABLE_COMMENTS: "false"

      # The list of changes the app's What's new screen shows, and the website's page made from
      # it: the list keeps its rules, its newest version is the build's versionName, and the page
      # is the one the list makes. Standard library only; the runner image has Python 3.
      - name: Check the list of changes
        run: python3 tools/changes_page.py --check

      # The launcher icon's face is written by a script from the design's numbers: the file in
      # the repository is the one the script writes. Standard library only.
      - name: Check the launcher icon
        run: python3 tools/make_launcher_icon.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # Must match gradle/gradle-daemon-jvm.properties.
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The default "enhanced" cache is a proprietary service that is only a free preview on
          # private repositories. "basic" is the open-source one built on GitHub's own cache.
          cache-provider: basic

      # The same four gates, in the same order, that are run locally before a change is called
      # done: formatting, Android Lint, unit tests, then a debug build. The shared module's tests
      # (ADR-014, phase 3) run here on Android's side; their iOS run needs a Mac and is run there.
      - name: Check, test and build
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest :shared:testAndroidHostTest assembleDebug

      # The console only prints the first lint error and a one-line test summary. The full lint
      # and test reports are kept, for failed runs only, so a red build can be diagnosed without
      # reproducing it locally.
      - name: Keep reports from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  rules:
    name: Cloud backup's security rules
    # The rules of the cloud backup (firebase/firestore.rules, ADR-012) on Firebase's Firestore
    # emulator. Nothing here reaches the real project: the emulator runs as "demo-dually", and
    # the job is given no secret.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @firebase/rules-unit-testing 6 asks for Node 24.12 or later.
          node-version: "24"

      # The emulator runs on Java, and firebase-tools refuses anything before 21.
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Exactly what package-lock.json names, nothing newer.
      - name: Install the test tools
        run: npm ci --no-audit --no-fund

      - name: Test the rules and the purchase check
        run: npm test

      # The Cloud Functions themselves (firebase/functions), with exactly the packages they are
      # deployed with: loading them proves every import is found. Their logic is tested above.
      - name: Load the Cloud Functions
        working-directory: firebase/functions
        run: |
          npm ci --no-audit --no-fund
          GCLOUD_PROJECT=demo-dually node -e "import('./index.js').then((m) => console.log(Object.keys(m).join(', ')))"
